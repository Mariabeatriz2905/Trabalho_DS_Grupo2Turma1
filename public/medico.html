<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PIAC — Área do Médico</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Segoe UI', sans-serif; background: #f5f4f2; color: #1a1a1a; }

        nav {
            background: #fff;
            border-bottom: 1px solid #e8e5e0;
            padding: 0 32px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            height: 60px;
        }
        .nav-logo {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .nav-logo-icon {
            width: 32px; height: 32px;
            background: #e84a12;
            border-radius: 8px;
            display: flex; align-items: center; justify-content: center;
        }

        .brand-mark {
            width: 100%;
            height: 100%;
            display: block;
            border-radius: inherit;
            object-fit: cover;
            object-position: center 42%;
            filter: saturate(1.08) contrast(1.05);
        }
        .nav-logo span {
            font-size: 1rem;
            font-weight: 700;
            color: #1a1a1a;
            letter-spacing: -0.3px;
        }
        .nav-logo small {
            font-size: 0.75rem;
            color: #888;
            font-weight: 400;
            margin-left: 4px;
        }
        .nav-right {
            display: flex;
            align-items: center;
            gap: 16px;
        }
        #nomeMedico {
            font-size: 0.85rem;
            color: #555;
        }
        .btn-sair {
            padding: 7px 16px;
            background: #f5f4f2;
            border: 1px solid #e0ddd8;
            border-radius: 7px;
            font-size: 0.82rem;
            font-weight: 600;
            color: #444;
            cursor: pointer;
            transition: background 0.15s;
        }
        .btn-sair:hover { background: #ece9e4; }

        .container { max-width: 1140px; margin: 32px auto; padding: 0 24px; }

        .grid2 { display: grid; grid-template-columns: minmax(0, 1.15fr) minmax(320px, 0.85fr); gap: 20px; align-items: start; }

        .section {
            background: #fff;
            border-radius: 14px;
            border: 0.5px solid #e8e5e0;
            padding: 24px;
            margin-bottom: 20px;
            box-shadow: 0 10px 28px rgba(55, 41, 31, 0.045);
        }
        .section-alertas { border-top: 4px solid #e84a12; }
        .section-utentes { border-top: 4px solid #8f8176; }
        .section-header {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 18px;
            padding-bottom: 14px;
            border-bottom: 1px solid #f0ede8;
        }
        .section-icon {
            width: 32px; height: 32px;
            border-radius: 8px;
            display: flex; align-items: center; justify-content: center;
            font-size: 15px;
            flex-shrink: 0;
        }
        .icon-orange { background: #fef0ea; color: #e84a12; }
        .icon-gray { background: #f5f4f2; color: #555; }
        .icon-green { background: #eaf5ef; color: #27a058; }
        .icon-blue { background: #eaf2fb; color: #2563c4; }
        .section h2 {
            font-size: 0.95rem;
            font-weight: 700;
            color: #1a1a1a;
        }

        table { width: 100%; border-collapse: collapse; }
        th {
            text-align: left;
            padding: 9px 12px;
            background: #fafaf9;
            font-size: 0.75rem;
            color: #888;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.4px;
            border-bottom: 1px solid #f0ede8;
        }
        td {
            padding: 10px 12px;
            border-bottom: 1px solid #f8f6f3;
            font-size: 0.87rem;
            color: #333;
        }
        tr:last-child td { border-bottom: none; }

        .badge {
            display: inline-block;
            padding: 3px 9px;
            border-radius: 20px;
            font-size: 0.72rem;
            font-weight: 700;
            letter-spacing: 0.3px;
        }
        .badge-critica { background: #fdecea; color: #c0392b; }
        .badge-alta { background: #fff4e6; color: #b85c00; }
        .badge-media { background: #eaf2fb; color: #1a5eb8; }
        .badge-baixa { background: #f0f0f0; color: #666; }
        .badge-novo { background: #fdecea; color: #c0392b; }
        .badge-visto { background: #fff4e6; color: #b85c00; }
        .badge-seguimento { background: #eaf2fb; color: #1a5eb8; }
        .badge-fechado { background: #f0f0f0; color: #666; }
        .badge-controlado { background: #eaf5ef; color: #1e7d42; }
        .badge-parcial { background: #fff4e6; color: #b85c00; }
        .badge-nao { background: #fdecea; color: #c0392b; }

        .row-critica td { background: #fffafa; }
        .row-alta td { background: #fffdf8; }

        select {
            padding: 5px 10px;
            border: 1px solid #e0ddd8;
            border-radius: 6px;
            font-size: 0.8rem;
            color: #333;
            background: #fff;
            cursor: pointer;
            outline: none;
        }
        select:focus { border-color: #e84a12; }

        .btn-ficha {
            padding: 6px 14px;
            background: #f5f4f2;
            border: 1px solid #e0ddd8;
            border-radius: 6px;
            font-size: 0.8rem;
            font-weight: 600;
            color: #444;
            cursor: pointer;
            transition: all 0.15s;
        }
        .btn-ficha:hover { background: #e84a12; color: #fff; border-color: #e84a12; }

        .alerta-lista { display: grid; gap: 12px; }
        .alerta-resumo {
            border: 1px solid #eee5dd;
            border-left-width: 5px;
            border-radius: 12px;
            background: #fff;
            padding: 14px 16px;
            box-shadow: 0 8px 20px rgba(55, 41, 31, 0.05);
        }
        .alerta-resumo.critica { border-left-color: #c0392b; background: #fffafa; }
        .alerta-resumo.alta { border-left-color: #f39c12; background: #fffdf8; }
        .alerta-resumo.media { border-left-color: #3498db; background: #f7fbff; }
        .alerta-resumo.baixa { border-left-color: #b8b2aa; background: #fafafa; }
        .alerta-topo {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 12px;
            margin-bottom: 10px;
        }
        .alerta-utente { font-weight: 700; color: #1f1f1f; font-size: 0.92rem; }
        .alerta-tipo-label { display: block; margin-top: 3px; color: #777; font-size: 0.78rem; }
        .alerta-badges { display: flex; flex-wrap: wrap; gap: 6px; justify-content: flex-end; }
        .alerta-motivo-box {
            background: rgba(255,255,255,0.72);
            border: 1px solid #f0ede8;
            border-radius: 10px;
            padding: 11px 12px;
            color: #444;
            font-size: 0.88rem;
            line-height: 1.55;
            white-space: normal;
            overflow-wrap: anywhere;
        }
        .alerta-estado-linha { margin-top: 10px; display: flex; align-items: center; gap: 8px; color: #777; font-size: 0.78rem; }
        .alerta-estado-linha select { min-width: 150px; }

        .detalhe-section {
            background: #fff;
            border-radius: 12px;
            border: 0.5px solid #e8e5e0;
            padding: 28px;
            margin-bottom: 20px;
            display: none;
        }
        .detalhe-title {
            font-size: 1.05rem;
            font-weight: 700;
            color: #1a1a1a;
            margin-bottom: 20px;
            padding-bottom: 14px;
            border-bottom: 1px solid #f0ede8;
        }
        .sub-title {
            font-size: 0.82rem;
            font-weight: 700;
            color: #888;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin: 20px 0 10px;
        }
        .sub-title:first-child { margin-top: 0; }

        .alerta-card {
            padding: 12px 16px;
            border-radius: 8px;
            margin-bottom: 8px;
            border-left: 3px solid;
        }
        .alerta-card.critica { background: #fffafa; border-color: #e74c3c; }
        .alerta-card.alta { background: #fffdf5; border-color: #f39c12; }
        .alerta-card.media { background: #f0f7ff; border-color: #3498db; }
        .alerta-card.baixa { background: #fafafa; border-color: #ccc; }
        .alerta-card-header {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 4px;
        }
        .alerta-tipo { font-size: 0.82rem; font-weight: 700; color: #333; }
        .alerta-data { font-size: 0.75rem; color: #aaa; }
        .alerta-motivo { font-size: 0.85rem; color: #555; line-height: 1.4; }

        .nota-card {
            padding: 12px 16px;
            background: #fafaf9;
            border-radius: 8px;
            border-left: 3px solid #e84a12;
            margin-bottom: 8px;
        }
        .nota-meta { font-size: 0.75rem; color: #aaa; margin-bottom: 4px; }
        .nota-texto { font-size: 0.88rem; color: #333; line-height: 1.5; }

        .notas-section {
            background: #fff;
            border-radius: 12px;
            border: 0.5px solid #e8e5e0;
            padding: 24px;
            margin-bottom: 20px;
            display: none;
        }
        textarea {
            width: 100%;
            padding: 12px 14px;
            border: 1.5px solid #e0ddd8;
            border-radius: 8px;
            font-size: 0.9rem;
            font-family: 'Segoe UI', sans-serif;
            min-height: 80px;
            resize: vertical;
            outline: none;
            color: #1a1a1a;
            background: #fafaf9;
            margin-top: 12px;
            transition: border-color 0.15s;
        }
        textarea:focus { border-color: #e84a12; background: #fff; }
        .btn-guardar {
            margin-top: 10px;
            padding: 10px 24px;
            background: #e84a12;
            color: #fff;
            border: none;
            border-radius: 8px;
            font-size: 0.88rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.15s;
        }
        .btn-guardar:hover { background: #c73e0e; }

        .empty-state {
            padding: 20px 0;
            text-align: center;
            color: #bbb;
            font-size: 0.88rem;
        }
    </style>
</head>
<body>
    <nav>
        <div class="nav-logo">
            <div class="nav-logo-icon">
                <img class="brand-mark" src="/assets/piac-icon.png" alt="PIAC">
            </div>
            <span>PIAC <small>— Área do Médico</small></span>
        </div>
        <div class="nav-right">
            <span id="nomeMedico"></span>
            <button class="btn-sair" onclick="sair()">Sair</button>
        </div>
    </nav>

    <div class="container">
        <div class="grid2">
            <div class="section section-alertas">
                <div class="section-header">
                    <div class="section-icon icon-orange">!</div>
                    <h2>Alertas Pendentes</h2>
                </div>
                <div id="alertasContainer"><p class="empty-state">A carregar...</p></div>
            </div>

            <div class="section section-utentes">
                <div class="section-header">
                    <div class="section-icon icon-gray">U</div>
                    <h2>Os Meus Utentes</h2>
                </div>
                <div id="utentesContainer"><p class="empty-state">A carregar...</p></div>
            </div>
        </div>

        <div class="detalhe-section" id="detalheUtente">
            <div class="detalhe-title" id="tituloDetalhe">Ficha Clínica</div>
            <div id="conteudoDetalhe"></div>
        </div>

        <div class="notas-section" id="secaoNotas">
            <div class="section-header">
                <div class="section-icon icon-blue">N</div>
                <h2>Notas Clínicas</h2>
            </div>
            <div id="notasContainer"><p class="empty-state">Selecione um utente para ver as notas.</p></div>
            <textarea id="novaNotaTexto" placeholder="Escrever nova nota clínica..."></textarea>
            <button class="btn-guardar" onclick="guardarNota()">Guardar Nota</button>
        </div>
    </div>

    <script>
        const token = localStorage.getItem('token');
        const utilizador = JSON.parse(localStorage.getItem('utilizador') || '{}');
        if (!token || utilizador.perfil !== 'medico') window.location.href = '/';
        document.getElementById('nomeMedico').textContent = utilizador.nome;

        let utenteAtualId = null;
        let medicoId = localStorage.getItem('perfilId');
        //  ESPECIALIDADE
        async function carregarPerfilMedico() {
            if (!medicoId) return;
            try {
                const res = await fetch(`/medicos/${medicoId}`, { 
                    headers: { 'Authorization': `Bearer ${token}` } 
                });
                if (res.ok) {
                    const dadosMedico = await res.json();
                    const especialidade = dadosMedico.especialidade || 'Clínica Geral';
                    
                    // Atualiza a barra de navegação com o nome e a especialidade
                    document.getElementById('nomeMedico').innerHTML = 
                        `<strong>${utilizador.nome}</strong> <span style="margin-left: 6px; font-size: 0.75rem; color: #888; border-left: 1px solid #ccc; padding-left: 6px;">${especialidade}</span>`;
                }
            } catch (err) {
                console.error("Erro ao carregar perfil do médico:", err);
            }
        }

        function normalizarTexto(valor) {
            return (valor || '—')
                .toString()
                .replace(/_/g, ' ')
                .replace(/(^|\s)\S/g, letra => letra.toUpperCase());
        }

        function tipoVisivel(tipo) {
            const tipos = {
                score_baixo: 'Score baixo',
                deterioracao: 'Deterioração',
                sintomas_persistentes: 'Sintomas persistentes',
                medicacao: 'Medicação',
                exame: 'Exame'
            };
            return tipos[tipo] || normalizarTexto(tipo);
        }

        function prioridadeVisivel(prioridade) {
            const prioridades = {
                critica: 'Crítica',
                alta: 'Alta',
                media: 'Média',
                baixa: 'Baixa'
            };
            return prioridades[prioridade] || normalizarTexto(prioridade);
        }

        function estadoVisivel(estado) {
            const estados = {
                NOVO: 'Novo',
                VISTO: 'Visto',
                EM_SEGUIMENTO: 'Em seguimento',
                FECHADO: 'Fechado'
            };
            return estados[estado] || normalizarTexto(estado);
        }

        async function carregarAlertas() {
            if (!medicoId) { document.getElementById('alertasContainer').innerHTML = '<p class="empty-state">ID do médico não encontrado.</p>'; return; }
            const res = await fetch(`/medicos/${medicoId}/alertas`, { headers: { 'Authorization': `Bearer ${token}` } });
            const alertas = await res.json();
            if (alertas.length === 0) {
                document.getElementById('alertasContainer').innerHTML = '<p class="empty-state" style="color:#27a058">Sem alertas pendentes.</p>';
                return;
            }
            document.getElementById('alertasContainer').innerHTML = `
                <div class="alerta-lista">
                    ${alertas.map(a => `
                        <article class="alerta-resumo ${a.prioridade || 'baixa'}">
                            <div class="alerta-topo">
                                <div>
                                    <div class="alerta-utente">${a.utente?.utilizador?.nome || 'Utente sem nome'}</div>
                                    <span class="alerta-tipo-label">${tipoVisivel(a.tipo)}</span>
                                </div>
                                <div class="alerta-badges">
                                    <span class="badge badge-${a.prioridade}">${prioridadeVisivel(a.prioridade)}</span>
                                    <span class="badge badge-${a.estado ? a.estado.toLowerCase().replace('_seguimento','seguimento') : 'novo'}">${estadoVisivel(a.estado)}</span>
                                </div>
                            </div>
                            <div class="alerta-motivo-box"><strong>Motivo:</strong> ${a.motivo || 'Sem motivo registado.'}</div>
                            <div class="alerta-estado-linha">
                                <span>Atualizar estado:</span>
                                <select onchange="atualizarAlerta(${a.id}, this.value)">
                                    <option value="NOVO" ${a.estado==='NOVO'?'selected':''}>Novo</option>
                                    <option value="VISTO" ${a.estado==='VISTO'?'selected':''}>Visto</option>
                                    <option value="EM_SEGUIMENTO" ${a.estado==='EM_SEGUIMENTO'?'selected':''}>Em seguimento</option>
                                    <option value="FECHADO" ${a.estado==='FECHADO'?'selected':''}>Fechado</option>
                                </select>
                            </div>
                        </article>
                    `).join('')}
                </div>`;
        }

        async function atualizarAlerta(id, estado) {
            await fetch(`/alertas/${id}`, {
                method: 'PATCH',
                headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
                body: JSON.stringify({ estado })
            });
        }

        async function carregarUtentes() {
            const res = await fetch('/utentes', { headers: { 'Authorization': `Bearer ${token}` } });
            const utentes = await res.json();
            document.getElementById('utentesContainer').innerHTML = `
                <table>
                    <thead><tr><th>Nome</th><th>NIF</th><th>Ação</th></tr></thead>
                    <tbody>
                        ${utentes.map(u => `
                            <tr>
                                <td style="font-weight:600">${u.utilizador?.nome || '—'}</td>
                                <td style="color:#888;font-size:0.82rem">${u.nif}</td>
                                <td><button class="btn-ficha" onclick="verFichaUtente(${u.id}, '${u.utilizador?.nome}')">Ver Ficha</button></td>
                            </tr>
                        `).join('')}
                    </tbody>
                </table>`;
        }

        async function verFichaUtente(utenteId, nome) {
    const detalhe = document.getElementById('detalheUtente');
    const titulo = document.getElementById('tituloDetalhe');
    const conteudo = document.getElementById('conteudoDetalhe');
    titulo.textContent = `Ficha Clínica — ${nome}`;
    conteudo.innerHTML = '<p class="empty-state">A carregar...</p>';
    detalhe.style.display = 'block';
    detalhe.scrollIntoView({ behavior: 'smooth' });

   
    async function fetchSeguro(url) {
        try {
            const res = await fetch(url, { headers: { 'Authorization': `Bearer ${token}` } });
            if (!res.ok) {
                console.warn(`[PIAC DEBUG] A rota ${url} respondeu com status ${res.status}. Certifica-te de que a rota existe no backend.`);
                return [];
            }
            return await res.json();
        } catch (err) {
            console.error(`[PIAC ERRO] Falha ao ligar à rota ${url}:`, err);
            return [];
        }
    }

  
    const avaliacoes = await fetchSeguro(`/utentes/${utenteId}/carat`);
    const alertas = await fetchSeguro(`/utentes/${utenteId}/alertas`);
    const medicacoes = await fetchSeguro(`/utentes/${utenteId}/medicacao`);
    const exames = await fetchSeguro(`/utentes/${utenteId}/exames`);
    const sintomas = await fetchSeguro(`/utentes/${utenteId}/sintomas`);

    
    const tabelaCARAT = !avaliacoes || avaliacoes.length === 0
        ? '<p class="empty-state">Sem avaliações CARAT.</p>'
        : `<table>
            <thead><tr><th>Data</th><th>Score</th><th>Interpretação</th><th>Recomendação</th></tr></thead>
            <tbody>
                ${avaliacoes.map(a => {
                    const cls = a.interpretacao === 'Controlado' ? 'controlado' :
                                a.interpretacao === 'Parcialmente Controlado' ? 'parcial' : 'nao';
                    return `<tr>
                        <td>${new Date(a.data || new Date()).toLocaleDateString('pt-PT')}</td>
                        <td><strong>${a.scoreTotal}/30</strong></td>
                        <td><span class="badge badge-${cls}">${a.interpretacao}</span></td>
                        <td style="font-size:0.82rem;color:#555">${a.textoRecomendacao || '—'}</td>
                    </tr>`;
                }).join('')}
            </tbody>
        </table>`;
    
   
    const tabelaMedicacao = !medicacoes || medicacoes.length === 0
         ? '<p class="empty-state">Nenhum medicamento ativo prescrito.</p>'
         : `<table>
            <thead><tr><th>Medicamento</th><th>Dose</th><th>Período</th></tr></thead>
            <tbody>
                 ${medicacoes.map(m => `
                    <tr>
                        <td style="font-weight:600; color:#2563c4;"> ${m.nome || m.descricao || 'Medicamento'}</td>
                        <td>${m.dose || '—'}</td>
                        <td><span class="badge badge-media">${m.periodo || '—'}</span></td>
                    </tr>
                `).join('')}
            </tbody>
        </table>`;

    const tabelaSintomas = !sintomas || sintomas.length === 0
        ? '<p class="empty-state">Sem sintomas reportados recentemente.</p>'
        : `<table>
            <thead><tr><th>Sintoma / Descrição</th><th>Data de Aparecimento</th><th>Intensidade</th></tr></thead>
            <tbody>
                ${sintomas.map(s => `
                    <tr>
                        <td style="font-weight:600">${s.descricao || 'Sintoma'}</td>
                        <td>${s.dataAparecimento ? new Date(s.dataAparecimento).toLocaleDateString('pt-PT') : '—'}</td>
                        <td><span class="badge badge-critica">Nível ${s.intensidade || '—'}/5</span></td>
                    </tr>
                `).join('')}
            </tbody>
        </table>`;

    const tabelaExames = !exames || exames.length === 0
        ? '<p class="empty-state">Nenhum exame de diagnóstico registado.</p>'
        : `<table>
            <thead><tr><th>Data</th><th>Exame / Tipo</th><th>Resultado Clínico</th></tr></thead>
            <tbody>
                ${exames.map(e => `
                    <tr>
                        <td>${e.data ? new Date(e.data).toLocaleDateString('pt-PT') : '—'}</td>
                        <td style="font-weight:600; color:#27a058;">${e.tipo || 'Exame'}</td>
                        <td style="font-size:0.85rem; color:#555;">${e.resultado || '—'}</td>
                    </tr>
                `).join('')}
            </tbody>
        </table>`;

   
    const alertasHTML = !alertas || alertas.length === 0
        ? '<p class="empty-state" style="color:#27a058">Sem alertas para este utente.</p>'
        : alertas.map(a => `
            <div class="alerta-card ${a.prioridade}">
                <div class="alerta-card-header">
                    <span class="alerta-tipo">${a.tipo ? tipoVisivel(a.tipo) : 'Alerta'}</span>
                    <span class="alerta-data">${new Date(a.data || new Date()).toLocaleDateString('pt-PT')}</span>
                    <span class="badge badge-${a.estado ? a.estado.toLowerCase().replace('_seguimento','seguimento') : 'novo'}">${estadoVisivel(a.estado)}</span>
                </div>
                <p class="alerta-motivo">${a.motivo || '—'}</p>
            </div>`).join('');

    
    conteudo.innerHTML = `
        <div class="sub-title">Histórico CARAT</div>
        ${tabelaCARAT}
        
        <div class="sub-title">Medicação Atual</div>
        ${tabelaMedicacao}
        
        <div class="sub-title">Sintomatologia Reportada</div>
        ${tabelaSintomas}
        
        <div class="sub-title">Exames Auxiliares de Diagnóstico</div>
        ${tabelaExames}
        
        <div class="sub-title">Alertas do Utente</div>
        ${alertasHTML}`;

    await carregarNotas(utenteId);
}

        async function carregarNotas(utenteId) {
            utenteAtualId = utenteId;
            document.getElementById('secaoNotas').style.display = 'block';
            const res = await fetch(`/utentes/${utenteId}/notas`, { headers: { 'Authorization': `Bearer ${token}` } });
            const notas = await res.json();
            const cont = document.getElementById('notasContainer');
            if (notas.length === 0) {
                cont.innerHTML = '<p class="empty-state">Sem notas clínicas para este utente.</p>';
                return;
            }
            cont.innerHTML = notas.map(n => `
                <div class="nota-card">
                    <div class="nota-meta">${new Date(n.dataNota).toLocaleDateString('pt-PT')} — Dr(a). ${n.medico?.utilizador?.nome || 'Médico'}</div>
                    <div class="nota-texto">${n.descricao}</div>
                </div>
            `).join('');
        }

        async function guardarNota() {
            const descricao = document.getElementById('novaNotaTexto').value.trim();
            if (!descricao) { alert('Escreva uma nota antes de guardar.'); return; }
            if (!utenteAtualId) { alert('Selecione um utente primeiro.'); return; }
            const res = await fetch(`/medicos/${medicoId}/utentes/${utenteAtualId}/notas`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
                body: JSON.stringify({ descricao })
            });
            if (res.ok) {
                document.getElementById('novaNotaTexto').value = '';
                await carregarNotas(utenteAtualId);
            } else {
                alert('Erro ao guardar nota.');
            }
        }

        function sair() { localStorage.clear(); window.location.href = '/'; }
        carregarPerfilMedico();
        carregarAlertas();
        carregarUtentes();
    </script>
</body>
</html>
