<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PIAC — Login</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Segoe UI', sans-serif;
            background:
                radial-gradient(circle at top left, rgba(232, 74, 18, 0.14), transparent 34%),
                linear-gradient(135deg, #fbfaf8 0%, #f1eee9 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }
        .piac-card {
            background: rgba(255,255,255,0.96);
            border-radius: 22px;
            border: 1px solid #ebe4dc;
            box-shadow: 0 24px 70px rgba(55, 41, 31, 0.14);
            overflow: hidden;
            width: 100%;
            max-width: 460px;
        }
        .piac-hero {
            min-height: 150px;
            background: linear-gradient(90deg, rgba(232,74,18,.95), rgba(255,139,38,.92)), url('/assets/piac-icon.png') center 40% / cover no-repeat;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 28px 24px;
        }
        .piac-content { padding: 34px 40px 36px; }
        .piac-logo {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 14px;
            margin-bottom: 26px;
            text-align: left;
        }
        .piac-logo-icon {
            width: 58px;
            height: 58px;
            background: #e84a12;
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            box-shadow: 0 12px 28px rgba(232,74,18,.28);
            overflow: hidden;
        }

        .brand-mark {
            width: 100%;
            height: 100%;
            display: block;
            border-radius: inherit;
            object-fit: cover;
            object-position: center 42%;
            filter: saturate(1.08) contrast(1.05);
        }
        .piac-logo-text h1 {
            font-size: 1.5rem;
            font-weight: 700;
            color: #1a1a1a;
            margin: 0;
            letter-spacing: -0.5px;
        }
        .piac-logo-text p {
            font-size: 0.78rem;
            color: #888;
            margin: 2px 0 0;
            line-height: 1.3;
        }
        .piac-divider {
            height: 1px;
            background: #f0ede8;
            margin-bottom: 28px;
        }
        label {
            display: block;
            font-size: 0.78rem;
            font-weight: 600;
            color: #444;
            margin-bottom: 6px;
            letter-spacing: 0.4px;
            text-transform: uppercase;
        }
        input {
            width: 100%;
            padding: 11px 14px;
            border: 1.5px solid #e0ddd8;
            border-radius: 8px;
            font-size: 0.95rem;
            color: #1a1a1a;
            background: #fafaf9;
            margin-bottom: 18px;
            transition: border-color 0.15s;
            outline: none;
            font-family: 'Segoe UI', sans-serif;
        }
        input:focus { border-color: #e84a12; background: #fff; }
        button {
            width: 100%;
            padding: 13px;
            background: #e84a12;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            letter-spacing: 0.2px;
            transition: background 0.15s;
            margin-top: 4px;
            font-family: 'Segoe UI', sans-serif;
        }
        button:hover { background: #c73e0e; }
        .erro {
            background: #fff5f3;
            border: 1px solid #fbc4b4;
            color: #a33010;
            padding: 11px 14px;
            border-radius: 8px;
            margin-top: 14px;
            font-size: 0.88rem;
            display: none;
        }
        .piac-info {
            margin-top: 24px;
            padding: 14px 16px;
            background: #fafaf9;
            border: 0.5px solid #e8e5e0;
            border-radius: 8px;
            font-size: 0.78rem;
            color: #777;
            line-height: 1.8;
        }
        .piac-info-title {
            font-size: 0.72rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: #aaa;
            font-weight: 600;
            margin-bottom: 6px;
        }
        .piac-dot {
            display: inline-block;
            width: 6px; height: 6px;
            border-radius: 50%;
            background: #e84a12;
            margin-right: 6px;
            vertical-align: middle;
        }
        .piac-info strong { color: #444; font-weight: 600; }
    </style>
</head>
<body>
    <div class="piac-card">
        <div class="piac-hero" aria-label="Imagem institucional PIAC"></div>
        <div class="piac-content">
            <div class="piac-logo">
                <div class="piac-logo-icon">
                    <img class="brand-mark" src="/assets/piac-icon.png" alt="PIAC">
                </div>
                <div class="piac-logo-text">
                    <h1>PIAC</h1>
                    <p>Plataforma Inteligente de<br>Acompanhamento Clínico</p>
                </div>
            </div>

            <div class="piac-divider"></div>

            <label for="email">Email</label>
            <input type="email" id="email" placeholder="exemplo@piac.pt">

            <label for="password">Password</label>
            <input type="password" id="password" placeholder="••••••••">

            <button onclick="fazerLogin()">Entrar na plataforma</button>

            <div class="erro" id="msgErro"></div>

            <div class="piac-info">
                <div class="piac-info-title">Contas de demonstração (clique para preencher)</div>
                <div style="cursor:pointer; margin-bottom:4px;" onclick="preencher('admin@piac.pt', 'admin123')">
                    <span class="piac-dot"></span><strong>Administrador:</strong> admin@piac.pt / admin123
                </div>
                <div style="cursor:pointer; margin-bottom:4px;" onclick="preencher('ana.martins@piac.pt', 'medico123')">
                    <span class="piac-dot"></span><strong>Médico:</strong> ana.martins@piac.pt / medico123
                </div>
                <div style="cursor:pointer;" onclick="preencher('joao.silva@email.pt', 'utente123')">
                    <span class="piac-dot"></span><strong>Utente:</strong> joao.silva@email.pt / utente123
                </div>
            </div>
        </div>
    </div>

    <script>
        function preencher(email, pass) {
            document.getElementById('email').value = email;
            document.getElementById('password').value = pass;
            document.getElementById('msgErro').style.display = 'none';
        }

        async function fazerLogin() {
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const msgErro = document.getElementById('msgErro');

            if (!email || !password) {
                msgErro.textContent = 'Preencha o email e a password.';
                msgErro.style.display = 'block';
                return;
            }

            try {
                const res = await fetch('/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });

                const dados = await res.json();

                if (!res.ok) {
                    msgErro.textContent = dados.erro || 'Erro ao fazer login.';
                    msgErro.style.display = 'block';
                    return;
                }

                localStorage.setItem('token', dados.token);
                localStorage.setItem('utilizador', JSON.stringify(dados.utilizador));
                localStorage.setItem('perfilId', dados.utilizador.perfilId);

                const perfil = dados.utilizador.perfil;
                if (perfil === 'utente') window.location.href = '/utente.html';
                else if (perfil === 'medico') window.location.href = '/medico.html';
                else if (perfil === 'administrador') window.location.href = '/admin.html';

            } catch (err) {
                msgErro.textContent = 'Erro de ligação ao servidor.';
                msgErro.style.display = 'block';
            }
        }

        document.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') fazerLogin();
        });
    </script>
</body>
</html>
