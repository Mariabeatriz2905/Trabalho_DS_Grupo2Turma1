<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PIAC — Painel de Administração</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Segoe UI', sans-serif; background: #f0f4f8; color: #333; }
        nav {
            background: #4a1a6e;
            color: white;
            padding: 16px 32px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        nav h1 { font-size: 1.2rem; }
        nav button { background: rgba(255,255,255,0.15); border: 1px solid rgba(255,255,255,0.3); color: white; padding: 8px 16px; border-radius: 6px; cursor: pointer; }
        .container { max-width: 1100px; margin: 32px auto; padding: 0 24px; }
        .tabs { display: flex; gap: 4px; margin-bottom: 24px; }
        .tab {
            padding: 10px 24px; border-radius: 8px 8px 0 0;
            cursor: pointer; font-weight: 600; font-size: 0.9rem;
            background: #ddd; color: #555; border: none;
        }
        .tab.active { background: white; color: #4a1a6e; }
        .panel { background: white; border-radius: 0 12px 12px 12px; padding: 28px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); display: none; }
        .panel.active { display: block; }
        table { width: 100%; border-collapse: collapse; }
        th { text-align: left; padding: 10px 12px; background: #f8f9fa; font-size: 0.82rem; color: #555; }
        td { padding: 10px 12px; border-bottom: 1px solid #f0f0f0; font-size: 0.88rem; }
        .btn { padding: 6px 14px; border: none; border-radius: 6px; cursor: pointer; font-size: 0.82rem; font-weight: 600; }
        .btn-danger { background: #fdecea; color: #e74c3c; }
        .btn-primary { background: #4a1a6e; color: white; padding: 10px 20px; font-size: 0.9rem; }
        .form-group { margin-bottom: 16px; }
        label { display: block; font-size: 0.85rem; font-weight: 600; margin-bottom: 6px; color: #444; }
        input, select {
            width: 100%; padding: 10px 14px;
            border: 2px solid #e0e0e0; border-radius: 8px;
            font-size: 0.9rem;
        }
        input:focus, select:focus { outline: none; border-color: #4a1a6e; }
        .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
        .sucesso { background: #d5f5e3; border: 1px solid #27ae60; color: #1e8449; padding: 12px; border-radius: 8px; margin-top: 12px; display:none; }
        .badge { display:inline-block; padding:3px 8px; border-radius:12px; font-size:0.75rem; font-weight:600; }
        .badge.ativo { background:#d5f5e3; color:#27ae60; }
        .badge.inativo { background:#fdecea; color:#e74c3c; }
    </style>
</head>
<body>
    <nav>
        <h1>⚙️ PIAC — Administração</h1>
        <span id="nomeAdmin"></span>
        <button onclick="sair()">Sair</button>
    </nav>

    <div class="container">
        <div class="tabs">
            <button class="tab active" onclick="mudarTab('utentes')">👥 Utentes</button>
            <button class="tab" onclick="mudarTab('medicos')">🩺 Médicos</button>
            <button class="tab" onclick="mudarTab('novoUtente')">➕ Novo Utente</button>
            <button class="tab" onclick="mudarTab('novoMedico')">➕ Novo Médico</button>
        </div>

        <!-- Lista de Utentes -->
        <div class="panel active" id="panel-utentes">
            <h2 style="margin-bottom:16px;color:#4a1a6e">Gestão de Utentes</h2>
            <div id="listaUtentes"><p style="color:#999">A carregar...</p></div>
        </div>

        <!-- Lista de Médicos -->
        <div class="panel" id="panel-medicos">
            <h2 style="margin-bottom:16px;color:#4a1a6e">Gestão de Médicos</h2>
            <div id="listaMedicos"><p style="color:#999">A carregar...</p></div>
        </div>

        <!-- Formulário Novo Utente -->
        <div class="panel" id="panel-novoUtente">
            <h2 style="margin-bottom:20px;color:#4a1a6e">Registar Novo Utente</h2>
            <div class="grid2">
                <div class="form-group">
                    <label>Nome Completo *</label>
                    <input type="text" id="u-nome" placeholder="João Silva">
                </div>
                <div class="form-group">
                    <label>Email *</label>
                    <input type="email" id="u-email" placeholder="joao@email.pt">
                </div>
                <div class="form-group">
                    <label>Password *</label>
                    <input type="password" id="u-password" placeholder="mínimo 6 caracteres">
                </div>
                <div class="form-group">
                    <label>NIF *</label>
                    <input type="text" id="u-nif" placeholder="123456789" maxlength="9">
                </div>
                <div class="form-group">
                    <label>Data de Nascimento *</label>
                    <input type="date" id="u-dataNascimento">
                </div>
                <div class="form-group">
                    <label>Contacto</label>
                    <input type="text" id="u-contacto" placeholder="910000000">
                </div>
            </div>
            <button class="btn btn-primary" onclick="criarUtente()">Criar Utente</button>
            <div class="sucesso" id="sucesso-utente">✅ Utente criado com sucesso!</div>
        </div>

        <!-- Formulário Novo Médico -->
        <div class="panel" id="panel-novoMedico">
            <h2 style="margin-bottom:20px;color:#4a1a6e">Registar Novo Médico</h2>
            <div class="grid2">
                <div class="form-group">
                    <label>Nome Completo *</label>
                    <input type="text" id="m-nome" placeholder="Dr. Ana Silva">
                </div>
                <div class="form-group">
                    <label>Email *</label>
                    <input type="email" id="m-email" placeholder="ana@clinica.pt">
                </div>
                <div class="form-group">
                    <label>Password *</label>
                    <input type="password" id="m-password">
                </div>
                <div class="form-group">
                    <label>Especialidade</label>
                    <input type="text" id="m-especialidade" placeholder="Pneumologia">
                </div>
                <div class="form-group">
                    <label>Contacto</label>
                    <input type="text" id="m-contacto" placeholder="961000000">
                </div>
            </div>
            <button class="btn btn-primary" onclick="criarMedico()">Criar Médico</button>
            <div class="sucesso" id="sucesso-medico">✅ Médico criado com sucesso!</div>
        </div>
    </div>

    <script>
        const token = localStorage.getItem('token');
        const utilizador = JSON.parse(localStorage.getItem('utilizador') || '{}');

        if (!token || utilizador.perfil !== 'administrador') window.location.href = '/';
        document.getElementById('nomeAdmin').textContent = utilizador.nome;

        function mudarTab(nome) {
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
            event.target.classList.add('active');
            document.getElementById(`panel-${nome}`).classList.add('active');

            if (nome === 'utentes') carregarUtentes();
            if (nome === 'medicos') carregarMedicos();
        }

        async function carregarUtentes() {
            const res = await fetch('/utentes', { headers: { 'Authorization': `Bearer ${token}` } });
            const utentes = await res.json();

            document.getElementById('listaUtentes').innerHTML = `
                <table>
                    <thead><tr><th>Nome</th><th>Email</th><th>NIF</th><th>Estado</th><th>Ação</th></tr></thead>
                    <tbody>
                        ${utentes.map(u => `<tr>
                            <td>${u.utilizador?.nome || '—'}</td>
                            <td>${u.utilizador?.email || '—'}</td>
                            <td>${u.nif}</td>
                            <td><span class="badge ${u.utilizador?.estado ? 'ativo' : 'inativo'}">${u.utilizador?.estado ? 'Ativo' : 'Inativo'}</span></td>
                            <td>
                                ${u.utilizador?.estado
                                    ? `<button class="btn btn-danger" onclick="desativar('utentes', ${u.id})">Desativar</button>`
                                    : '<span style="color:#999;font-size:0.82rem">Desativado</span>'}
                            </td>
                        </tr>`).join('')}
                    </tbody>
                </table>`;
        }

        async function carregarMedicos() {
            const res = await fetch('/medicos', { headers: { 'Authorization': `Bearer ${token}` } });
            const medicos = await res.json();

            document.getElementById('listaMedicos').innerHTML = `
                <table>
                    <thead><tr><th>Nome</th><th>Email</th><th>Especialidade</th><th>Estado</th><th>Ação</th></tr></thead>
                    <tbody>
                        ${medicos.map(m => `<tr>
                            <td>${m.utilizador?.nome || '—'}</td>
                            <td>${m.utilizador?.email || '—'}</td>
                            <td>${m.especialidade || '—'}</td>
                            <td><span class="badge ${m.utilizador?.estado ? 'ativo' : 'inativo'}">${m.utilizador?.estado ? 'Ativo' : 'Inativo'}</span></td>
                            <td>
                                ${m.utilizador?.estado
                                    ? `<button class="btn btn-danger" onclick="desativar('medicos', ${m.id})">Desativar</button>`
                                    : '<span style="color:#999;font-size:0.82rem">Desativado</span>'}
                            </td>
                        </tr>`).join('')}
                    </tbody>
                </table>`;
        }

        async function desativar(tipo, id) {
            if (!confirm('Tem a certeza que quer desativar esta conta?')) return;
            await fetch(`/${tipo}/${id}`, {
                method: 'DELETE',
                headers: { 'Authorization': `Bearer ${token}` }
            });
            tipo === 'utentes' ? carregarUtentes() : carregarMedicos();
        }

        async function criarUtente() {
            const dados = {
                nome: document.getElementById('u-nome').value,
                email: document.getElementById('u-email').value,
                password: document.getElementById('u-password').value,
                nif: document.getElementById('u-nif').value,
                dataNascimento: document.getElementById('u-dataNascimento').value,
                contacto: document.getElementById('u-contacto').value || undefined
            };
            const res = await fetch('/utentes', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
                body: JSON.stringify(dados)
            });
            if (res.ok) {
                document.getElementById('sucesso-utente').style.display = 'block';
                setTimeout(() => document.getElementById('sucesso-utente').style.display = 'none', 3000);
            } else {
                const err = await res.json();
                alert(err.erro || 'Erro ao criar utente.');
            }
        }

        async function criarMedico() {
            const dados = {
                nome: document.getElementById('m-nome').value,
                email: document.getElementById('m-email').value,
                password: document.getElementById('m-password').value,
                especialidade: document.getElementById('m-especialidade').value || undefined,
                contacto: document.getElementById('m-contacto').value || undefined
            };
            const res = await fetch('/medicos', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
                body: JSON.stringify(dados)
            });
            if (res.ok) {
                document.getElementById('sucesso-medico').style.display = 'block';
                setTimeout(() => document.getElementById('sucesso-medico').style.display = 'none', 3000);
            } else {
                const err = await res.json();
                alert(err.erro || 'Erro ao criar médico.');
            }
        }

        function sair() { localStorage.clear(); window.location.href = '/'; }

        carregarUtentes();
    </script>
</body>
</html>
