<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PIAC — Administração</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Segoe UI', sans-serif; background: #f5f4f2; color: #1a1a1a; }

        nav {
            background: #fff;
            border-bottom: 1px solid #e8e5e0;
            padding: 0 32px;
            display: flex; justify-content: space-between; align-items: center;
            height: 60px;
        }
        .nav-logo { display: flex; align-items: center; gap: 10px; }
        .nav-logo-icon {
            width: 32px; height: 32px; background: #e84a12;
            border-radius: 8px; display: flex; align-items: center; justify-content: center;
        }

        .brand-mark {
            width: 100%;
            height: 100%;
            display: block;
            border-radius: inherit;
            object-fit: cover;
            object-position: center 42%;
            filter: saturate(1.08) contrast(1.05);
        }
        .nav-logo span { font-size: 1rem; font-weight: 700; color: #1a1a1a; letter-spacing: -0.3px; }
        .nav-logo small { font-size: 0.75rem; color: #888; font-weight: 400; margin-left: 4px; }
        .nav-right { display: flex; align-items: center; gap: 16px; }
        #nomeAdmin { font-size: 0.85rem; color: #555; }
        .btn-sair {
            padding: 7px 16px; background: #f5f4f2;
            border: 1px solid #e0ddd8; border-radius: 7px;
            font-size: 0.82rem; font-weight: 600; color: #444;
            cursor: pointer; transition: background 0.15s;
        }
        .btn-sair:hover { background: #ece9e4; }

        .container { max-width: 1100px; margin: 32px auto; padding: 0 24px; }

        .tabs { display: flex; gap: 4px; margin-bottom: 0; }
        .tab {
            padding: 10px 22px;
            border-radius: 8px 8px 0 0;
            cursor: pointer; font-weight: 600; font-size: 0.85rem;
            background: #ece9e4; color: #777; border: none;
            border-bottom: none; transition: all 0.15s;
            font-family: 'Segoe UI', sans-serif;
        }
        .tab.active { background: #fff; color: #e84a12; border: 0.5px solid #e8e5e0; border-bottom: none; }
        .tab:hover:not(.active) { background: #e0ddd8; }

        .panel {
            background: #fff;
            border-radius: 0 12px 12px 12px;
            border: 0.5px solid #e8e5e0;
            padding: 28px;
            display: none;
        }
        .panel.active { display: block; }

        .panel-title { font-size: 1rem; font-weight: 700; color: #1a1a1a; margin-bottom: 20px; padding-bottom: 14px; border-bottom: 1px solid #f0ede8; }

        table { width: 100%; border-collapse: collapse; }
        th {
            text-align: left; padding: 9px 12px;
            background: #fafaf9; font-size: 0.72rem; color: #aaa;
            font-weight: 600; text-transform: uppercase; letter-spacing: 0.4px;
            border-bottom: 1px solid #f0ede8;
        }
        td { padding: 10px 12px; border-bottom: 1px solid #f8f6f3; font-size: 0.87rem; color: #333; }
        tr:last-child td { border-bottom: none; }

        .badge { display: inline-block; padding: 3px 9px; border-radius: 20px; font-size: 0.72rem; font-weight: 700; }
        .badge-ativo { background: #eaf5ef; color: #166534; }
        .badge-inativo { background: #fef2f2; color: #991b1b; }

        .btn-danger {
            padding: 5px 12px; background: #fef2f2;
            border: 1px solid #fca5a5; border-radius: 6px;
            font-size: 0.78rem; font-weight: 600; color: #991b1b;
            cursor: pointer; transition: all 0.15s;
        }
        .btn-danger:hover { background: #fee2e2; }

        .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
        .form-group { margin-bottom: 16px; }
        label {
            display: block; font-size: 0.78rem; font-weight: 600;
            color: #444; margin-bottom: 6px; letter-spacing: 0.3px; text-transform: uppercase;
        }
        input, select {
            width: 100%; padding: 10px 14px;
            border: 1.5px solid #e0ddd8; border-radius: 8px;
            font-size: 0.9rem; color: #1a1a1a; background: #fafaf9;
            outline: none; transition: border-color 0.15s;
            font-family: 'Segoe UI', sans-serif;
        }
        input:focus, select:focus { border-color: #e84a12; background: #fff; }

        .btn-primary {
            padding: 11px 24px; background: #e84a12;
            color: white; border: none; border-radius: 8px;
            font-size: 0.9rem; font-weight: 600; cursor: pointer;
            transition: background 0.15s; margin-top: 4px;
            font-family: 'Segoe UI', sans-serif;
        }
        .btn-primary:hover { background: #c73e0e; }

        .sucesso {
            background: #eaf5ef; border: 1px solid #86efac;
            color: #166534; padding: 11px 14px;
            border-radius: 8px; margin-top: 12px;
            font-size: 0.88rem; display: none;
        }
        .empty-state { padding: 16px 0; text-align: center; color: #bbb; font-size: 0.88rem; }
    </style>
</head>
<body>
    <nav>
        <div class="nav-logo">
            <div class="nav-logo-icon">
                <img class="brand-mark" src="/assets/piac-icon.png" alt="PIAC">
            </div>
            <span>PIAC <small>— Administração</small></span>
        </div>
        <div class="nav-right">
            <span id="nomeAdmin"></span>
            <button class="btn-sair" onclick="sair()">Sair</button>
        </div>
    </nav>

    <div class="container">
        <div class="tabs">
            <button class="tab active" onclick="mudarTab('utentes', this)">Utentes</button>
            <button class="tab" onclick="mudarTab('medicos', this)">Médicos</button>
            <button class="tab" onclick="mudarTab('novoUtente', this)">+ Novo Utente</button>
            <button class="tab" onclick="mudarTab('novoMedico', this)">+ Novo Médico</button>
        </div>

        <div class="panel active" id="panel-utentes">
            <div class="panel-title">Gestão de Utentes</div>
            <div id="listaUtentes"><p class="empty-state">A carregar...</p></div>
        </div>

        <div class="panel" id="panel-medicos">
            <div class="panel-title">Gestão de Médicos</div>
            <div id="listaMedicos"><p class="empty-state">A carregar...</p></div>
        </div>

        <div class="panel" id="panel-novoUtente">
            <div class="panel-title">Registar Novo Utente</div>
            <div class="grid2">
                <div class="form-group"><label>Nome Completo *</label><input type="text" id="u-nome" placeholder="João Silva"></div>
                <div class="form-group"><label>Email *</label><input type="email" id="u-email" placeholder="joao@email.pt"></div>
                <div class="form-group"><label>Password *</label><input type="password" id="u-password" placeholder="mínimo 6 caracteres"></div>
                <div class="form-group"><label>NIF *</label><input type="text" id="u-nif" placeholder="123456789" maxlength="9"></div>
                <div class="form-group"><label>Data de Nascimento *</label><input type="date" id="u-dataNascimento"></div>
                <div class="form-group"><label>Contacto</label><input type="text" id="u-contacto" placeholder="910000000"></div>
                <div class="form-group">
                    <label>Médico Atribuído</label>
                    <select id="u-medico"><option value="">Sem médico atribuído</option></select>
                </div>
            </div>
            <button class="btn-primary" onclick="criarUtente()">Criar Utente</button>
            <div class="sucesso" id="sucesso-utente">Utente criado com sucesso!</div>
        </div>

        <div class="panel" id="panel-novoMedico">
            <div class="panel-title">Registar Novo Médico</div>
            <div class="grid2">
                <div class="form-group"><label>Nome Completo *</label><input type="text" id="m-nome" placeholder="Dr. Ana Silva"></div>
                <div class="form-group"><label>Email *</label><input type="email" id="m-email" placeholder="ana@clinica.pt"></div>
                <div class="form-group"><label>Password *</label><input type="password" id="m-password"></div>
                <div class="form-group"><label>Especialidade</label><input type="text" id="m-especialidade" placeholder="Pneumologia"></div>
                <div class="form-group"><label>Contacto</label><input type="text" id="m-contacto" placeholder="961000000"></div>
            </div>
            <button class="btn-primary" onclick="criarMedico()">Criar Médico</button>
            <div class="sucesso" id="sucesso-medico">Médico criado com sucesso!</div>
        </div>
    </div>

    <script>
        const token = localStorage.getItem('token');
        const utilizador = JSON.parse(localStorage.getItem('utilizador') || '{}');
        if (!token || utilizador.perfil !== 'administrador') window.location.href = '/';
        document.getElementById('nomeAdmin').textContent = utilizador.nome;

        function mudarTab(nome, el) {
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
            el.classList.add('active');
            document.getElementById(`panel-${nome}`).classList.add('active');
            if (nome === 'utentes') carregarUtentes();
            if (nome === 'medicos') carregarMedicos();
        }

        async function carregarUtentes() {
            const res = await fetch('/utentes', { headers: { 'Authorization': `Bearer ${token}` } });
            const utentes = await res.json();
            document.getElementById('listaUtentes').innerHTML = `
                <table>
                    <thead><tr><th>Nome</th><th>Email</th><th>NIF</th><th>Estado</th><th>Ação</th></tr></thead>
                    <tbody>
                        ${utentes.map(u => `<tr>
                            <td style="font-weight:600">${u.utilizador?.nome || '—'}</td>
                            <td style="color:#888">${u.utilizador?.email || '—'}</td>
                            <td style="color:#888;font-size:0.82rem">${u.nif}</td>
                            <td><span class="badge ${u.utilizador?.estado ? 'badge-ativo' : 'badge-inativo'}">${u.utilizador?.estado ? 'Ativo' : 'Inativo'}</span></td>
                            <td>${u.utilizador?.estado
                                ? `<button class="btn-danger" onclick="desativar('utentes', ${u.id})">Desativar</button>`
                                : '<span style="color:#bbb;font-size:0.8rem">Desativado</span>'}
                            </td>
                        </tr>`).join('')}
                    </tbody>
                </table>`;
        }

        async function carregarMedicos() {
            const res = await fetch('/medicos', { headers: { 'Authorization': `Bearer ${token}` } });
            const medicos = await res.json();
            document.getElementById('listaMedicos').innerHTML = `
                <table>
                    <thead><tr><th>Nome</th><th>Email</th><th>Especialidade</th><th>Estado</th><th>Ação</th></tr></thead>
                    <tbody>
                        ${medicos.map(m => `<tr>
                            <td style="font-weight:600">${m.utilizador?.nome || '—'}</td>
                            <td style="color:#888">${m.utilizador?.email || '—'}</td>
                            <td style="color:#888">${m.especialidade || '—'}</td>
                            <td><span class="badge ${m.utilizador?.estado ? 'badge-ativo' : 'badge-inativo'}">${m.utilizador?.estado ? 'Ativo' : 'Inativo'}</span></td>
                            <td>${m.utilizador?.estado
                                ? `<button class="btn-danger" onclick="desativar('medicos', ${m.id})">Desativar</button>`
                                : '<span style="color:#bbb;font-size:0.8rem">Desativado</span>'}
                            </td>
                        </tr>`).join('')}
                    </tbody>
                </table>`;
        }

        async function desativar(tipo, id) {
            if (!confirm('Tem a certeza que quer desativar esta conta?')) return;
            await fetch(`/${tipo}/${id}`, { method: 'DELETE', headers: { 'Authorization': `Bearer ${token}` } });
            tipo === 'utentes' ? carregarUtentes() : carregarMedicos();
        }

        async function criarUtente() {
            const dados = {
                nome: document.getElementById('u-nome').value,
                email: document.getElementById('u-email').value,
                password: document.getElementById('u-password').value,
                nif: document.getElementById('u-nif').value,
                dataNascimento: document.getElementById('u-dataNascimento').value,
                contacto: document.getElementById('u-contacto').value || undefined,
                medicoId: document.getElementById('u-medico').value ? Number(document.getElementById('u-medico').value) : undefined
            };
            const res = await fetch('/utentes', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
                body: JSON.stringify(dados)
            });
            if (res.ok) {
                document.getElementById('sucesso-utente').style.display = 'block';
                setTimeout(() => document.getElementById('sucesso-utente').style.display = 'none', 3000);
            } else {
                const err = await res.json();
                alert(err.erro || 'Erro ao criar utente.');
            }
        }

        async function criarMedico() {
            const dados = {
                nome: document.getElementById('m-nome').value,
                email: document.getElementById('m-email').value,
                password: document.getElementById('m-password').value,
                especialidade: document.getElementById('m-especialidade').value || undefined,
                contacto: document.getElementById('m-contacto').value || undefined
            };
            const res = await fetch('/medicos', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
                body: JSON.stringify(dados)
            });
            if (res.ok) {
                document.getElementById('sucesso-medico').style.display = 'block';
                setTimeout(() => document.getElementById('sucesso-medico').style.display = 'none', 3000);
            } else {
                const err = await res.json();
                alert(err.erro || 'Erro ao criar médico.');
            }
        }

        async function carregarMedicosDropdown() {
            const res = await fetch('/medicos', { headers: { 'Authorization': `Bearer ${token}` } });
            const medicos = await res.json();
            const select = document.getElementById('u-medico');
            medicos.forEach(m => {
                const opt = document.createElement('option');
                opt.value = m.id;
                opt.textContent = `${m.utilizador?.nome} — ${m.especialidade || 'Geral'}`;
                select.appendChild(opt);
            });
        }

        function sair() { localStorage.clear(); window.location.href = '/'; }

        carregarMedicosDropdown();
        carregarUtentes();
    </script>
</body>
</html>
